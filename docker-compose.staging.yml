# Staging ngeWARteg: MySQL + API (Node/Express + scheduler) + frontend (Nginx).
# Pakai:  cp .env.staging.example .env.staging   (isi kata sandi dan JWT_SECRET)
#         docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
# Buka:   http://<alamat-server>:8080   (API di http://<alamat-server>:8080/api)
name: ngewarteg-staging

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?isi MYSQL_ROOT_PASSWORD di .env.staging}
      MYSQL_DATABASE: ${DB_NAME:-ngewarteg}
      MYSQL_USER: ${DB_USER:-ngewarteg}
      MYSQL_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env.staging}
      TZ: Asia/Jakarta
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+07:00"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ngewarteg}
      DB_USER: ${DB_USER:-ngewarteg}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET (minimal 16 karakter) di .env.staging}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      SCHEDULER_INTERVAL_MIN: ${SCHEDULER_INTERVAL_MIN:-5}
      DEV_TOOLS: ${DEV_TOOLS:-0}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    expose:
      - "3000"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/env.staging.js:/usr/share/nginx/html/js/env.js:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data:
