function info(l){
  const rem=l.close-S.now;let state,pct=null;
  if(!l.active)state='paused';else if(rem<=0)state='closed';else if(l.stock<=0)state='soldout';else if(rem>120)state='upcoming';else state='live';
  if(rem>0&&rem<=120)pct=rem>90?20:rem>60?30:rem>30?40:50;
  const price=pct?Math.round(l.normal*(1-pct/100)):l.normal;
  let next=null;if(pct&&pct<50){const th=pct===20?90:pct===30?60:30;next={pct:pct+10,inMin:rem-th}}
  return {rem,pct,price,state,next};
}
function liveList(){
  return S.listings.filter(l=>{const m=merch(l.merchantId);return m&&m.status==='active'&&info(l).state==='live'}).sort((a,b)=>dist(merch(a.merchantId))-dist(merch(b.merchantId)));
}

/* ---------- scheduler simulasi (FR-06 dan FR-10) ---------- */
function advance(mins){
  const before={};S.listings.forEach(l=>before[l.id]=info(l));
  S.now+=mins;let changed=0;
  S.listings.forEach(l=>{
    const a=before[l.id],b=info(l),m=merch(l.merchantId);if(!m||m.status!=='active')return;
    if(a.state==='upcoming'&&b.state==='live'){changed++;S.users.filter(u=>u.role==='consumer'&&u.active).forEach(u=>notify(u.id,'Listing baru: '+l.name+' di '+m.name+', diskon '+b.pct+'%','diskon'));notify(m.userId,'Listing "'+l.name+'" mulai tayang dengan diskon '+b.pct+'%','diskon')}
    else if(a.state==='live'&&b.state==='live'&&b.pct>a.pct){changed++;S.users.filter(u=>u.role==='consumer'&&u.active).forEach(u=>notify(u.id,'Diskon '+l.name+' ('+m.name+') naik jadi '+b.pct+'%','diskon'));notify(m.userId,'Diskon "'+l.name+'" naik jadi '+b.pct+'%','diskon')}
    else if(a.state==='live'&&b.state==='closed'){changed++;notify(m.userId,'Listing "'+l.name+'" ditutup otomatis (lewat jam tutup)','info')}
  });
  S.res.filter(r=>r.status==='active').forEach(r=>{
    if(r.expiresAt<=S.now){
      r.status='expired';const l=listing(r.listingId);if(l)l.stock+=r.qty;changed++;
      notify(r.userId,'Voucher '+r.id+' kedaluwarsa. Booking fee tidak dikembalikan.','voucher');
      const m=merch(r.merchantId);if(m)notify(m.userId,'Voucher '+r.id+' kedaluwarsa, '+r.qty+' porsi kembali ke stok','voucher');
      logEv('Scheduler: voucher '+r.id+' kedaluwarsa');
    }else if(r.expiresAt-S.now<=10&&!r.warned){r.warned=true;notify(r.userId,'Voucher '+r.id+' kedaluwarsa dalam '+(r.expiresAt-S.now)+' menit','voucher')}
  });
  if(changed)logEv('Scheduler '+T(S.now)+': '+changed+' perubahan harga atau status');
  save();refresh();
}

function qrSvg(code,size){
  const n=21;let h=2166136261;for(const ch of code)h=Math.imul(h^ch.charCodeAt(0),16777619)>>>0;
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296};
  const inF=(x,y)=>(x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8);let cells='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(inF(x,y))continue;if(rnd()>.5)cells+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'}
  const f=(x,y)=>'<g transform="translate('+x+','+y+')"><rect width="7" height="7"/><rect x="1" y="1" width="5" height="5" fill="#fff"/><rect x="2" y="2" width="3" height="3"/></g>';
  return '<svg viewBox="-1 -1 '+(n+2)+' '+(n+2)+'" width="'+size+'" height="'+size+'" fill="#111" role="img" aria-label="QR voucher '+code+' (simulasi)"><rect x="-1" y="-1" width="'+(n+2)+'" height="'+(n+2)+'" fill="#fff"/>'+cells+f(0,0)+f(n-7,0)+f(0,n-7)+'</svg>';
}

  +'<div class="grid g5" style="margin-bottom:16px"><div class="card"><span class="muted">Listing tayang</span><div class="kpi">'+live.length+'</div><span class="tag warn">'+low+' hampir habis</span></div><div class="card"><span class="muted">Menunggu pickup</span><div class="kpi">'+pend+'</div></div><div class="card"><span class="muted">Transaksi selesai</span><div class="kpi">'+done+'</div></div><div class="card"><span class="muted">Porsi tersisa</span><div class="kpi">'+left+'</div></div><div class="card"><span class="muted">Rating rata-rata</span><div class="kpi">'+(avg?'⭐ '+avg:'-')+'</div></div></div>'
  +'<div class="card" style="margin-bottom:16px"><h2>Panduan singkat</h2><div class="guide"><div>1. Tambah listing sisa makanan</div><div>2. Pembeli reservasi, pesanan muncul di sini</div><div>3. Minta kode voucher, lalu Validasi</div></div></div>'
  +'<h2 style="margin-bottom:10px">Listing saya</h2>'+listingTable(ls,false));
}
function listingTable(ls,actions){
  if(!ls.length)return '<div class="empty">Belum ada listing.</div>';
  return '<div class="table-wrap"><table><thead><tr><th>Makanan</th><th>Harga normal</th><th>Harga sekarang</th><th>Diskon</th><th>Stok</th><th>Tutup</th><th>Status</th>'+(actions?'<th>Aksi</th>':'')+'</tr></thead><tbody>'+ls.map(l=>{const i=info(l);
    return '<tr><td>'+l.emoji+' '+esc(l.name)+'</td><td>'+rp(l.normal)+'</td><td><b>'+rp(i.price)+'</b></td><td>'+(i.pct?'<span class="tag warn">'+i.pct+'%</span>'+(i.next?' <small class="muted">'+i.next.pct+'% dalam '+dur(i.next.inMin)+'</small>':''):'<span class="muted">belum</span>')+'</td><td><span class="stock">'+(actions?'<button class="mini" aria-label="Kurangi stok" onclick="adjStock(\''+l.id+'\',-1)">−</button>':'')+'<b>'+l.stock+'</b>'+(actions?'<button class="mini" aria-label="Tambah stok" onclick="adjStock(\''+l.id+'\',1)">+</button>':'')+'</span></td><td>'+T(l.close)+'</td><td>'+listState(l)+'</td>'+(actions?'<td><button class="soft" onclick="toggleActive(\''+l.id+'\')">'+(l.active?'Jeda':'Aktifkan')+'</button> <button class="danger" onclick="soldOut(\''+l.id+'\')">Tandai habis</button></td>':'')+'</tr>'}).join('')+'</tbody></table></div>';
}
function vMListing(){
  const m=myMerchant(),ls=S.listings.filter(l=>l.merchantId===m.id),ok=m.status==='active';
  return mShell(reviewBanner(m)+'<div class="page-head"><div><h1>Kelola Listing</h1><p>Tambah dan kelola makanan surplus. Harga diskon dihitung otomatis.</p></div></div>'+listingTable(ls,true)
  +'<div class="card" style="margin-top:18px"><h2>Tambah listing baru</h2>'+(ok?'':'<p class="muted">Form aktif setelah akun disetujui admin.</p>')+'<div class="formgrid"><div class="field"><label for="ln">Nama makanan</label><input id="ln" placeholder="Contoh: Nasi Rames Komplit"></div><div class="field"><label for="lemoji">Ikon</label><select id="lemoji">'+EMOJIS.map(e=>'<option>'+e+'</option>').join('')+'</select></div><div class="field"><label for="lq">Jumlah porsi</label><input id="lq" type="number" min="1" value="5"></div><div class="field"><label for="lp">Harga normal (Rp)</label><input id="lp" type="number" min="1000" step="500" value="20000" oninput="previewSched()"></div><div class="field"><label for="lc">Jam tutup</label><input id="lc" type="time" value="'+T24(Math.max(m.close,S.now+60))+'" oninput="previewSched()"></div><div class="field"><label for="lnote">Catatan</label><input id="lnote" placeholder="Isi paket, level pedas, dan lain-lain"></div></div><div class="info"><b>Jadwal diskon otomatis</b><ul class="timeline" id="sched"></ul></div><button class="primary big-btn" '+(ok?'':'disabled')+' onclick="addListing()">Simpan listing</button></div>');
}
function vMValidate(){
  const m=myMerchant(),pend=S.res.filter(r=>r.merchantId===m.id&&r.status==='active');
  return mShell('<div class="page-head"><div><h1>Validasi Voucher</h1><p>Minta pembeli menunjukkan kode atau QR, lalu masukkan di sini.</p></div></div><div class="card"><div class="vbig"><input id="vcode" placeholder="NW-0000" aria-label="Kode voucher" autocomplete="off" onkeydown="if(event.key===\'Enter\')validateCode()"><button class="primary big-btn" onclick="validateCode()">Validasi</button></div><div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="soft" onclick="scanSim()">📷 Simulasi scan QR</button><span class="muted">Di versi final, tombol ini membuka kamera.</span></div><div id="vres" class="vres"></div></div>'
  +'<div class="card" style="margin-top:16px"><h2>Menunggu pickup ('+pend.length+')</h2>'+(pend.length?pend.map(r=>'<div class="sumrow"><span><b>'+r.id+'</b> · '+esc(r.name)+' x'+r.qty+' · '+esc(user(r.userId).name)+'</span><span><span class="tag warn">sampai '+T(r.expiresAt)+'</span> <button class="soft" onclick="document.getElementById(\'vcode\').value=\''+r.id+'\';validateCode()">Pakai kode</button></span></div>').join(''):'<p class="muted">Belum ada pesanan menunggu pickup.</p>')+'</div>');
}
function renderVal(){
  const el=document.getElementById('vres');if(!el)return;
  if(!VAL){el.innerHTML='';return}
  if(!VAL.ok){el.innerHTML='<div class="card" style="border-color:#fecaca;margin-top:14px"><span class="tag red">✖ '+esc(VAL.msg)+'</span><p class="muted">Periksa kembali kode pada voucher pembeli.</p></div>';return}
  const r=S.res.find(x=>x.id===VAL.id),b=user(r.userId);
  el.innerHTML='<div class="card" style="border-color:#bbf7d0;margin-top:14px"><span class="tag">✔ Voucher valid</span><h2 style="margin-top:10px">'+r.emoji+' '+esc(r.name)+'</h2><p>'+r.qty+' porsi · '+esc(b.name)+' · berlaku sampai '+T(r.expiresAt)+'</p><div class="sumrow"><span>Booking fee sudah dibayar</span><b>'+rp(r.fee)+'</b></div><div class="sumrow total"><span>Tagih sisa pembayaran</span><b>'+rp(Math.max(0,r.unit*r.qty-r.fee))+'</b></div><button class="primary big-btn" style="margin-top:12px;width:100%" onclick="confirmPickup(\''+r.id+'\')">Konfirmasi pickup</button></div>';
}
function vMTrans(){
  const m=myMerchant();let list=S.res.filter(r=>r.merchantId===m.id).slice().reverse();if(MF.status!=='all')list=list.filter(r=>r.status===MF.status);
  return mShell('<div class="page-head"><div><h1>Transaksi</h1><p>Reservasi, pickup, transaksi selesai, dan voucher expired.</p></div></div><div class="toolbar"><select aria-label="Filter status" onchange="MF.status=this.value;render()">'+[['all','Semua status'],['active','Menunggu pickup'],['completed','Selesai'],['expired','Expired']].map(o=>'<option value="'+o[0]+'"'+(MF.status===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Makanan</th><th>Porsi</th><th>Pembeli</th><th>Status</th><th>Waktu</th><th>Rating</th></tr></thead><tbody>'+list.map(r=>'<tr><td>'+r.id+'</td><td>'+esc(r.name)+'</td><td>'+r.qty+'</td><td>'+esc(user(r.userId).name)+'</td><td>'+statusTag(r.status)+'</td><td>'+(r.status==='completed'?'selesai '+T(r.completedAt):'sampai '+T(r.expiresAt))+'</td><td>'+(r.rating?'<span class="star-static">'+stars(r.rating.score)+'</span>':'-')+'</td></tr>').join('')+'</tbody></table></div>');
}
function vMProfile(){
  const m=myMerchant(),avg=avgRating(m.id);
  return mShell(reviewBanner(m)+'<div class="page-head"><div><h1>Profil Usaha</h1><p>Informasi merchant yang tampil ke pembeli.</p></div></div><div class="grid g2"><div class="card"><div class="field"><label for="mn">Nama usaha</label><input id="mn" value="'+esc(m.name)+'"></div><div class="field"><label for="mad">Alamat</label><input id="mad" value="'+esc(m.address)+'"></div><div class="formgrid"><div class="field"><label for="mo">Jam buka</label><input id="mo" type="time" value="'+T24(m.open)+'"></div><div class="field"><label for="mc">Jam tutup</label><input id="mc" type="time" value="'+T24(m.close)+'"></div></div><button class="primary" onclick="saveProfileM()">Simpan perubahan</button></div><div class="card"><h2>Status akun</h2><p>'+mStatusTag(m.status)+'</p><p class="muted">'+(m.status==='active'?'Merchant dapat membuat listing dan menerima reservasi.':m.status==='review'?'Menunggu verifikasi admin.':'Pendaftaran ditolak.')+'</p><h2 style="margin-top:14px">Rating pembeli</h2><p style="font-size:24px">'+(avg?'<span class="star-static">★</span> '+avg+' / 5':'Belum ada rating')+'</p></div></div>');
}

/* ---------- admin ---------- */
const aItems=[['a:dashboard','Dashboard','🏠'],['a:users','Pengguna','👥'],['a:merchants','Merchant','🏪'],['a:transactions','Transaksi','🧾']];
function aShell(body){return shell(aItems,'Admin',body,'Administrator<br>ngeWARteg')}
function vADash(){
  const consumers=S.users.filter(u=>u.role==='consumer').length,act=S.merchants.filter(m=>m.status==='active').length,rev=S.merchants.filter(m=>m.status==='review');
  return aShell('<div class="page-head"><div><h1>Dashboard Admin</h1><p>Monitoring pengguna, merchant, listing, dan transaksi.</p></div></div><div class="grid g4" style="margin-bottom:16px"><div class="card"><span class="muted">Total pembeli</span><div class="kpi">'+consumers+'</div></div><div class="card"><span class="muted">Merchant aktif</span><div class="kpi">'+act+'</div></div><div class="card"><span class="muted">Listing tayang</span><div class="kpi">'+liveList().length+'</div></div><div class="card"><span class="muted">Transaksi</span><div class="kpi">'+S.res.length+'</div></div></div>'
  +'<div class="card" style="margin-bottom:16px"><h2>Menunggu verifikasi ('+rev.length+')</h2>'+(rev.length?rev.map(m=>'<div class="sumrow"><span><b>'+esc(m.name)+'</b> · '+esc(m.address)+'</span><span><button class="okbtn" onclick="approveMerchant(\''+m.id+'\')">Setujui</button> <button class="danger" onclick="rejectMerchant(\''+m.id+'\')">Tolak</button></span></div>').join(''):'<p class="muted">Tidak ada merchant yang menunggu verifikasi.</p>')+'</div>'
  +'<h2 style="margin-bottom:10px">Aktivitas terbaru</h2><div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Aktivitas</th></tr></thead><tbody>'+S.log.slice(0,8).map(x=>'<tr><td>'+T(x.t)+'</td><td>'+esc(x.text)+'</td></tr>').join('')+'</tbody></table></div>');
}
function vAUsers(){
  return aShell('<div class="page-head"><div><h1>Pengguna</h1><p>Kelola akun pengguna platform.</p></div></div><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Email</th><th>Peran</th><th>Lokasi</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+S.users.map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.email)+'</td><td>'+({consumer:'Pembeli',merchant:'Merchant',admin:'Admin'}[u.role])+'</td><td>'+esc(u.area||'-')+'</td><td>'+(u.active?'<span class="tag">Aktif</span>':'<span class="tag red">Nonaktif</span>')+'</td><td>'+(u.role==='admin'?'-':'<button class="soft" onclick="toggleUser(\''+u.id+'\')">'+(u.active?'Nonaktifkan':'Aktifkan')+'</button>')+'</td></tr>').join('')+'</tbody></table></div>');
}
function vAMerchants(){
  return aShell('<div class="page-head"><div><h1>Merchant</h1><p>Verifikasi merchant dan kelola status akun usahanya.</p></div></div><div class="table-wrap"><table><thead><tr><th>Merchant</th><th>Alamat</th><th>Listing tayang</th><th>Rating</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+S.merchants.map(m=>{const n=S.listings.filter(l=>l.merchantId===m.id&&info(l).state==='live').length,a=avgRating(m.id);
    return '<tr><td>'+esc(m.name)+'</td><td>'+esc(m.address)+'</td><td>'+n+'</td><td>'+(a?'⭐ '+a:'-')+'</td><td>'+mStatusTag(m.status)+'</td><td>'+(m.status==='review'?'<button class="okbtn" onclick="approveMerchant(\''+m.id+'\')">Setujui</button> <button class="danger" onclick="rejectMerchant(\''+m.id+'\')">Tolak</button>':m.status==='rejected'?'<button class="soft" onclick="reactivateMerchant(\''+m.id+'\')">Aktifkan</button>':'-')+'</td></tr>'}).join('')+'</tbody></table></div>');
}
function vATrans(){
  let list=S.res.slice().reverse();if(AF.status!=='all')list=list.filter(r=>r.status===AF.status);
  return aShell('<div class="page-head"><div><h1>Transaksi</h1><p>Monitoring seluruh transaksi di platform.</p></div></div><div class="toolbar"><select aria-label="Filter status" onchange="AF.status=this.value;render()">'+[['all','Semua status'],['active','Menunggu pickup'],['completed','Selesai'],['expired','Expired']].map(o=>'<option value="'+o[0]+'"'+(AF.status===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Pembeli</th><th>Merchant</th><th>Item</th><th>Total</th><th>Status</th><th>Waktu</th></tr></thead><tbody>'+list.map(r=>'<tr><td>'+r.id+'</td><td>'+esc(user(r.userId).name)+'</td><td>'+esc(merch(r.merchantId).name)+'</td><td>'+esc(r.name)+' x'+r.qty+'</td><td>'+rp(r.unit*r.qty)+'</td><td>'+statusTag(r.status)+'</td><td>'+T(r.createdAt)+'</td></tr>').join('')+'</tbody></table></div>');
}

/* ---------- modal ---------- */
function modalDetail(){
  const l=listing(M.id);if(!l){M=null;return ''}
  const m=merch(l.merchantId),i=info(l),u=cur(),live=i.state==='live';
  const stepper=n=>'<div class="stepper">'+['Detail dan porsi','Booking fee','Voucher'].map((s,k)=>'<span class="step '+(k<=n?'on':'')+'">'+(k+1)+'. '+s+'</span>').join('')+'</div>';
  if(M.step==='voucher'){
    const r=S.res.find(x=>x.id===M.resId);
    return stepper(2)+'<h2 style="text-align:center">Reservasi berhasil 🎉</h2><div class="qrbox">'+qrSvg(r.id,190)+'<div class="muted" style="font-size:11px">QR (simulasi untuk prototype)</div><div class="code">'+r.id+'</div><p><b>'+r.emoji+' '+esc(r.name)+'</b> x'+r.qty+'<br>'+esc(m.name)+'</p><p><span class="tag warn">Berlaku sampai '+T(r.expiresAt)+' · sisa '+dur(r.expiresAt-S.now)+'</span></p><p class="muted">Tunjukkan voucher ke merchant, lalu bayar sisa '+rp(Math.max(0,r.unit*r.qty-r.fee))+' langsung di tempat.</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="primary" onclick="go(\'c:voucher\')">Lihat Voucher Saya</button><button class="soft" onclick="closeModal()">Cari lagi</button></div></div>';
  }
  if(M.step==='fee'){
    const total=i.price*M.qty;
    return stepper(1)+'<h2>Booking fee</h2><p class="muted">Booking fee menjamin porsimu. Sisa harga dibayar langsung ke merchant saat pengambilan.</p><div class="sumrow"><span>'+l.emoji+' '+esc(l.name)+' x'+M.qty+' @ '+rp(i.price)+'</span><b>'+rp(total)+'</b></div><div class="sumrow"><span>Booking fee (bayar sekarang)</span><b>'+rp(BOOKING_FEE)+'</b></div><div class="sumrow total"><span>Sisa dibayar ke merchant</span><b>'+rp(Math.max(0,total-BOOKING_FEE))+'</b></div><div class="info">Pembayaran memakai payment sandbox (simulasi), tanpa uang sungguhan. Harga dikunci saat kamu membayar. Booking fee tidak dikembalikan bila voucher kedaluwarsa (aturan demo).</div><div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="soft" onclick="M.step=\'detail\';renderModal()">Kembali</button><button class="primary big-btn" onclick="pay()">Bayar '+rp(BOOKING_FEE)+' (sandbox)</button></div>';
  }
  const urg=live?(i.rem<=30?'<span class="tag red">⏰ Tutup '+dur(i.rem)+' lagi</span>':'<span class="tag gray">Tutup '+T(l.close)+' · '+dur(i.rem)+' lagi</span>'):'';
  const max=Math.max(1,Math.min(3,l.stock));
  return stepper(0)+'<div class="grid g2" style="align-items:start"><div class="food-thumb" style="height:200px;font-size:80px" aria-hidden="true">'+l.emoji+'</div><div><div class="badges">'+urg+(live?'<span class="tag '+(l.stock<=2?'red':'')+'">'+(l.stock<=2?'Tinggal ':'Sisa ')+l.stock+' porsi</span>':'<span class="tag red">Tidak tersedia</span>')+'</div><h2 style="margin:8px 0 2px">'+esc(l.name)+'</h2><div class="muted">'+esc(m.name)+' • '+km(dist(m))+'</div><div class="muted">📍 '+esc(m.address)+'</div><div class="price-row" style="margin:10px 0"><div><span class="old">'+rp(l.normal)+'</span><div class="price">'+rp(i.price)+'</div></div>'+(live?'<span class="disc">-'+i.pct+'%</span>':'')+'</div><p>'+esc(l.note||'')+'</p>'+(i.next?'<div class="hint">📈 Diskon naik jadi '+i.next.pct+'% dalam '+dur(i.next.inMin)+'</div>':live?'<div class="hint">🔥 Diskon sudah maksimal</div>':'')+'</div></div>'
  +(live?'<div class="qtyrow"><b>Jumlah porsi</b><button class="mini" onclick="setQty(-1)" aria-label="Kurangi">−</button><b style="font-size:20px">'+Math.min(M.qty,max)+'</b><button class="mini" onclick="setQty(1)" aria-label="Tambah">+</button><span class="muted">Total '+rp(i.price*Math.min(M.qty,max))+' · maks. '+max+' porsi</span></div><button class="primary big-btn" style="width:100%" onclick="toFee()">'+(u?'Lanjut ke booking fee':'Masuk untuk reservasi')+'</button>':'<div class="warnbox" style="margin-top:12px">Penawaran ini sudah tidak tersedia (habis, dijeda, atau lewat jam tutup).</div>');
}
function modalRate(){
  const r=S.res.find(x=>x.id===M.resId);
  return '<h2>Beri rating</h2><p class="muted">'+esc(r.name)+' · '+esc(merch(r.merchantId).name)+'</p><div class="stars" role="radiogroup" aria-label="Rating bintang">'+[1,2,3,4,5].map(n=>'<button class="'+(n<=M.score?'on':'')+'" onclick="setStar('+n+')" aria-label="'+n+' bintang">★</button>').join('')+'</div><div class="field"><label for="rt">Feedback (opsional)</label><textarea id="rt" rows="3" placeholder="Ceritakan pengalamanmu"></textarea></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="soft" onclick="closeModal()">Batal</button><button class="primary" onclick="submitRating()">Kirim rating</button></div>';
}
function renderModal(){
  const el=$('#modal');if(!M){el.innerHTML='';return}
  el.innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><button class="x" onclick="closeModal()" aria-label="Tutup">×</button>'+(M.type==='rate'?modalRate():modalDetail())+'</div></div>';
}

/* ---------- render utama ---------- */
function guardRoute(){
  const u=cur(),pub=['landing','explore','login','register-c','register-m'];
  if(!u){if(!pub.includes(route))route='login';return}
  if(['login','register-c','register-m','landing'].includes(route))route=homeOf(u.role);
  if(u.role==='consumer'){if(!(route==='explore'||route.startsWith('c:')))route='c:home'}
  else if(route==='explore'||!route.startsWith(u.role==='merchant'?'m:':'a:'))route=homeOf(u.role);
}
function renderApp(){
  const v={landing:vLanding,login:vLogin,'register-c':vRegC,'register-m':vRegM,explore:vExplore,'c:home':vCHome,'c:voucher':vCVoucher,'c:history':vCHistory,'c:profile':vCProfile,'m:dashboard':vMDash,'m:listing':vMListing,'m:validate':vMValidate,'m:transactions':vMTrans,'m:profile':vMProfile,'a:dashboard':vADash,'a:users':vAUsers,'a:merchants':vAMerchants,'a:transactions':vATrans}[route]||vLanding;
  $('#app').innerHTML=v();
  if(route==='m:validate')renderVal();
  if(route==='m:listing')previewSched();
}
function render(){guardRoute();renderTop();renderApp();renderModal();renderClock()}
function refresh(){
  const a=document.activeElement;
  if(a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName)&&a.closest&&a.closest('#app,#modal')){renderTop();renderClock();return}
  render();
}

/* ---------- mulai ---------- */
function init(){
  S=load()||seed();S.running=false;
  if(S.session&&!user(S.session))S.session=null;
  document.body.classList.toggle('big',!!S.big);
  const u=cur();route=u?homeOf(u.role):(/admin/.test(location.hash)?'login':'landing');
  document.addEventListener('click',e=>{if(bellOpen&&!e.target.closest('.bellwrap')){bellOpen=false;renderTop()}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&M)closeModal()});
  render();
}
init();
</script>
